; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:kc868_a16]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
test_framework = unity
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	;-D ASYNCWEBSERVER_REGEX
	-std=gnu++2a
upload_speed = 921600
lib_deps = 
	xreef/PCF8574 library@^2.4.0
	bblanchon/ArduinoJson@^7.4.2
	esp32async/AsyncTCP@^3.4.10
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit SSD1306@^2.5.16
	ModbusClient=https://github.com/eModbus/eModbus.git
	esp32async/ESPAsyncWebServer@^3.9.6
	adafruit/RTClib
	olikraus/U8g2@^2.36.17
	adafruit/Adafruit SH110X@^2.1.14
	adafruit/Adafruit FRAM I2C@^2.0.3
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
test_build_src = true
board_build.filesystem = littlefs

[env:native]
platform = native
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-std=gnu++14
lib_deps = 
	xreef/PCF8574 library@^2.4.0
	bblanchon/ArduinoJson@^7.4.2
	esp32async/AsyncTCP@^3.4.10
	adafruit/Adafruit GFX Library@^1.12.4
	adafruit/Adafruit SSD1306@^2.5.16
	ModbusClient=https://github.com/eModbus/eModbus.git
	esp32async/ESPAsyncWebServer@^3.9.6
	adafruit/RTClib
	olikraus/U8g2@^2.36.17
	adafruit/Adafruit SH110X@^2.1.14
	robtillaart/FRAM_I2C@^0.8.4
	adafruit/Adafruit FRAM I2C@^2.0.3
test_framework = unity
